version: '3.8'

services:
  sariktest:
    build: .
    container_name: sariktest-bot
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sariktest-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sarikdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
